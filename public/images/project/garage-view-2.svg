<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="rampFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#223042" />
      <stop offset="100%" stop-color="#0E1622" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FFE082" />
    </linearGradient>
  </defs>

  <!-- Background Space -->
  <rect width="1000" height="650" fill="#0C131D" />

  <!-- Garage Entrance Ramp & Turning Lane -->
  <polygon points="120,650 880,650 680,260 320,260" fill="url(#rampFloor)" stroke="#2C3D55" stroke-width="2" />
  
  <!-- Anti-slip Grooves / Architectural Ramp Details -->
  <g stroke="#1A2636" stroke-width="2">
    <line x1="280" y1="320" x2="720" y2="320" />
    <line x1="240" y1="380" x2="760" y2="380" />
    <line x1="200" y1="440" x2="800" y2="440" />
    <line x1="160" y1="510" x2="840" y2="510" />
    <line x1="120" y1="590" x2="880" y2="590" />
  </g>

  <!-- Side Safety Curbs with Gold Reflectors -->
  <polygon points="120,650 320,260 300,260 80,650" fill="#D4AF37" opacity="0.8" />
  <polygon points="880,650 680,260 700,260 920,650" fill="#D4AF37" opacity="0.8" />

  <!-- Electronic Entry Gate / Barrier Arm -->
  <g transform="translate(330, 210)">
    <rect x="0" y="0" width="30" height="90" rx="3" fill="#1C2738" stroke="#D4AF37" stroke-width="1.5" />
    <!-- Gate Arm in Perspective -->
    <rect x="25" y="15" width="280" height="12" rx="2" fill="#E2E8F0" />
    <!-- Arm Stripes -->
    <rect x="50" y="15" width="30" height="12" fill="#D4AF37" />
    <rect x="110" y="15" width="30" height="12" fill="#D4AF37" />
    <rect x="170" y="15" width="30" height="12" fill="#D4AF37" />
    <rect x="230" y="15" width="30" height="12" fill="#D4AF37" />
  </g>

  <!-- CCTV Surveillance Camera on Entrance -->
  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="8" height="40" fill="#64748B" />
    <path d="M -15 35 L 20 20 L 25 35 L -10 50 Z" fill="#E2E8F0" />
    <circle cx="15" cy="30" r="4" fill="#0284C7" />
    <circle cx="15" cy="30" r="1.5" fill="#EF4444" />
  </g>

  <!-- Top Title -->
  <rect x="30" y="30" width="380" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    منظور إضافي لمسارات ومداخل الجراج
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    بوابات دخول وخروج إلكترونية مع كاميرات مراقبة متكاملة
  </text>
</svg>
