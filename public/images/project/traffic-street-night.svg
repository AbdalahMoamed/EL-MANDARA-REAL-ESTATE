<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="trafficNightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040810" />
      <stop offset="100%" stop-color="#0B1320" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#trafficNightSky)" />

  <!-- Roadway Night Perspective with Light Streaks -->
  <polygon points="500,280 0,650 1000,650" fill="#0E1724" />
  
  <!-- Red & Amber Tail Light Streaks -->
  <line x1="480" y1="310" x2="260" y2="650" stroke="#EF4444" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <line x1="520" y1="310" x2="740" y2="650" stroke="#FDE047" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Suez Traffic Department Illuminated Sign on Left -->
  <g transform="translate(120, 260)">
    <rect x="0" y="0" width="220" height="130" fill="#0A111C" rx="4" stroke="#0284C7" stroke-width="2" />
    <rect x="15" y="15" width="190" height="36" fill="#0369A1" rx="2" />
    <text x="110" y="38" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">إدارة مرور السويس</text>
  </g>

  <!-- Golden View Lit Perimeter on Right -->
  <g transform="translate(640, 240)">
    <polygon points="0,40 320,0 320,380 0,380" fill="#070D16" stroke="#D4AF37" stroke-width="2" />
    <text x="160" y="180" font-family="'Cairo', sans-serif" font-size="16" font-weight="800" fill="#D4AF37" text-anchor="middle">Compound Golden View</text>
    <line x1="40" y1="200" x2="280" y2="200" stroke="#D4AF37" stroke-width="1.5" />
    <text x="160" y="225" font-family="'Cairo', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" text-anchor="middle">إضاءة محيطية راقية وأمن 24/7</text>
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    شارع المرور – إطلالة ليلية
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    أمان مروري كامل وإضاءات معمارية تزين مدخل الكمبوند ليلاً
  </text>
</svg>
