<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="daySun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#daySun)" />

  <!-- Natural Daylight Road with Pavers -->
  <polygon points="500,260 0,650 1000,650" fill="#475569" />
  <line x1="500" y1="260" x2="500" y2="650" stroke="#F8FAFC" stroke-width="3" stroke-dasharray="14,14" />

  <!-- Residential Facades -->
  <polygon points="0,120 400,240 400,550 0,650" fill="#1E293B" stroke="#D4AF37" stroke-width="1.5" />
  <polygon points="1000,120 600,240 600,550 1000,650" fill="#334155" stroke="#D4AF37" stroke-width="1.5" />

  <!-- Modern Sunlit Balconies -->
  <rect x="50" y="220" width="120" height="40" fill="#0284C7" opacity="0.3" stroke="#D4AF37" stroke-width="1" />
  <rect x="50" y="280" width="120" height="40" fill="#0284C7" opacity="0.3" stroke="#D4AF37" stroke-width="1" />
  <rect x="830" y="220" width="120" height="40" fill="#0284C7" opacity="0.3" stroke="#D4AF37" stroke-width="1" />
  <rect x="830" y="280" width="120" height="40" fill="#0284C7" opacity="0.3" stroke="#D4AF37" stroke-width="1" />

  <!-- Green Planters & Palms -->
  <g>
    <circle cx="360" cy="450" r="28" fill="#16A34A" />
    <circle cx="640" cy="450" r="28" fill="#16A34A" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    الشارع الداخلي – إطلالة نهارية
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    ضوء طبيعي وافر وتناغم معماري مريح للسكان
  </text>
</svg>
