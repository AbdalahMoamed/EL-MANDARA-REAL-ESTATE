<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="marbleWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="entranceGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#marbleWall)" />

  <!-- Grand Portico / Entrance Canopy with Luxury Gold Cladding -->
  <polygon points="120,100 880,100 950,220 50,220" fill="#0C1320" stroke="url(#entranceGold)" stroke-width="3" />
  
  <!-- Architectural Downlights in Canopy -->
  <g fill="#FFE58F">
    <circle cx="200" cy="200" r="10" />
    <circle cx="350" cy="200" r="10" />
    <circle cx="500" cy="200" r="14" />
    <circle cx="650" cy="200" r="10" />
    <circle cx="800" cy="200" r="10" />
  </g>

  <!-- Marble Columns Left & Right -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="60" height="380" fill="#1E293B" stroke="url(#entranceGold)" stroke-width="2" />
    <rect x="-10" y="0" width="80" height="20" fill="url(#entranceGold)" />
    <rect x="-10" y="360" width="80" height="20" fill="url(#entranceGold)" />
  </g>
  <g transform="translate(760, 220)">
    <rect x="0" y="0" width="60" height="380" fill="#1E293B" stroke="url(#entranceGold)" stroke-width="2" />
    <rect x="-10" y="0" width="80" height="20" fill="url(#entranceGold)" />
    <rect x="-10" y="360" width="80" height="20" fill="url(#entranceGold)" />
  </g>

  <!-- High-End Glass Double Doors with Gold Handles -->
  <rect x="340" y="220" width="320" height="380" fill="#0E2138" stroke="url(#entranceGold)" stroke-width="2" />
  <line x1="500" y1="220" x2="500" y2="600" stroke="url(#entranceGold)" stroke-width="3" />
  <!-- Glass Reflections -->
  <polygon points="360,240 480,240 420,580 360,580" fill="#38BDF8" opacity="0.15" />
  <polygon points="520,240 640,240 580,580 520,580" fill="#38BDF8" opacity="0.15" />
  
  <!-- Door Handles -->
  <rect x="475" y="380" width="8" height="80" rx="3" fill="url(#entranceGold)" />
  <rect x="517" y="380" width="8" height="80" rx="3" fill="url(#entranceGold)" />

  <!-- Golden View Monogram Above Entrance -->
  <g transform="translate(500, 160)">
    <circle cx="0" cy="0" r="28" fill="#0C1420" stroke="url(#entranceGold)" stroke-width="2" />
    <text x="0" y="8" font-family="'Cairo', sans-serif" font-size="18" font-weight="900" fill="url(#entranceGold)" text-anchor="middle">GV</text>
  </g>

  <!-- Marble Entrance Steps -->
  <polygon points="100,600 900,600 960,650 40,650" fill="#141E2C" stroke="#334155" stroke-width="1.5" />
  <line x1="60" y1="625" x2="940" y2="625" stroke="url(#entranceGold)" stroke-width="2" opacity="0.6" />

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    المداخل الفاخرة للأبنية السكنية
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    تصميم فندقي رخامي بوابات إلكترونية ومصاعد حديثة
  </text>
</svg>
