<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="suezSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#suezSky)" />

  <!-- Street Axis: 24 October Suez Boulevard -->
  <polygon points="500,280 440,650 560,650" fill="#334155" />
  <polygon points="200,280 50,650 440,650 500,280" fill="#475569" />
  <polygon points="500,280 800,280 950,650 560,650" fill="#475569" />

  <!-- Golden View Boundary Wall & Luxury Gates -->
  <g transform="translate(560, 260)">
    <polygon points="0,20 440,60 390,390 0,220" fill="#1E293B" stroke="#D4AF37" stroke-width="2" />
    <!-- Gate Arch -->
    <rect x="40" y="80" width="90" height="150" fill="#0F172A" stroke="#D4AF37" stroke-width="2" />
    <text x="85" y="110" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#D4AF37" text-anchor="middle">بوابة</text>
    <text x="85" y="130" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Golden View</text>
  </g>

  <!-- Suez Landmark Directional Board -->
  <g transform="translate(100, 360)">
    <rect x="20" y="70" width="8" height="150" fill="#64748B" />
    <rect x="0" y="0" width="220" height="75" rx="6" fill="#047857" stroke="#FFFFFF" stroke-width="2" />
    <text x="110" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      منطقة 24 أكتوبر – السويس
    </text>
    <text x="110" y="52" font-family="'Cairo', sans-serif" font-size="11" font-weight="600" fill="#FDE047" text-anchor="middle">
      مرور السويس | المجمع الطبي ⬅
    </text>
  </g>

  <!-- Palm Trees on Boulevard -->
  <g>
    <circle cx="280" cy="380" r="22" fill="#15803D" />
    <line x1="280" y1="400" x2="280" y2="470" stroke="#78350F" stroke-width="5" />
    <circle cx="360" cy="340" r="18" fill="#15803D" />
    <line x1="360" y1="355" x2="360" y2="420" stroke="#78350F" stroke-width="4" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    محور 24 أكتوبر المحيط بالمشروع
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    موقع حيوي ممتاز يربط المشروع مباشرة بكافة أرجاء السويس
  </text>
</svg>
