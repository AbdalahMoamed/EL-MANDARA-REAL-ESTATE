<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="trafficDaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#trafficDaySky)" />

  <!-- Road Avenue in Front of Traffic Department -->
  <polygon points="500,280 0,650 1000,650" fill="#334155" />
  <line x1="500" y1="280" x2="500" y2="650" stroke="#FDE047" stroke-width="4" stroke-dasharray="16,14" />

  <!-- Suez Traffic Department Signboard / Silhouette on Left -->
  <g transform="translate(120, 260)">
    <rect x="0" y="0" width="220" height="130" fill="#1E293B" rx="4" stroke="#64748B" stroke-width="2" />
    <rect x="15" y="15" width="190" height="36" fill="#0369A1" rx="2" />
    <text x="110" y="38" font-family="'Cairo', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">إدارة مرور السويس</text>
    <text x="110" y="80" font-family="'Cairo', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">المجمع المروري والخدمي</text>
  </g>

  <!-- Golden View Boundary on Right -->
  <g transform="translate(640, 240)">
    <polygon points="0,40 320,0 320,380 0,380" fill="#0F172A" stroke="#D4AF37" stroke-width="2" />
    <text x="160" y="180" font-family="'Cairo', sans-serif" font-size="16" font-weight="800" fill="#D4AF37" text-anchor="middle">Compound Golden View</text>
    <text x="160" y="210" font-family="'Cairo', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">واجهة المشروع المطلة على شارع المرور</text>
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    شارع المرور – إطلالة نهارية
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    بجوار مرور السويس مباشرة وبموقع حيوي يسهل الوصول إليه
  </text>
</svg>
