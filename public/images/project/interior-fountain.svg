<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="fountainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="waterPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#fountainSky)" />

  <!-- Surrounding Manicured Gardens & Walkway -->
  <rect x="0" y="420" width="1000" height="230" fill="#0D1F17" />
  
  <!-- Geometric Luxury Fountain Structure (Confirmed Amenity #6) -->
  <g transform="translate(500, 440)">
    <!-- Outer Basin -->
    <ellipse cx="0" cy="50" rx="360" ry="110" fill="#13243A" stroke="#D4AF37" stroke-width="3" />
    <!-- Water Layer -->
    <ellipse cx="0" cy="45" rx="330" ry="95" fill="url(#waterPool)" opacity="0.9" />
    <!-- Center Stone Pedestal Tier 1 -->
    <ellipse cx="0" cy="20" rx="180" ry="50" fill="#1E293B" stroke="#D4AF37" stroke-width="2" />
    <!-- Center Stone Pedestal Tier 2 -->
    <ellipse cx="0" cy="-10" rx="90" ry="25" fill="#1E293B" stroke="#D4AF37" stroke-width="2" />

    <!-- Dancing Water Jets & Cascade -->
    <path d="M 0 -10 Q -40 -120 0 -170 Q 40 -120 0 -10" fill="none" stroke="#E0F2FE" stroke-width="4" opacity="0.9" />
    <path d="M 0 -10 Q -90 -100 -120 10" fill="none" stroke="#BAE6FD" stroke-width="3" opacity="0.8" />
    <path d="M 0 -10 Q 90 -100 120 10" fill="none" stroke="#BAE6FD" stroke-width="3" opacity="0.8" />
    <path d="M 0 -10 Q -160 -80 -220 30" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.7" />
    <path d="M 0 -10 Q 160 -80 220 30" fill="none" stroke="#BAE6FD" stroke-width="2.5" opacity="0.7" />

    <!-- Underwater Golden LED Illumination -->
    <circle cx="-140" cy="40" r="16" fill="#FDE047" opacity="0.5" />
    <circle cx="140" cy="40" r="16" fill="#FDE047" opacity="0.5" />
    <circle cx="0" cy="80" r="22" fill="#FDE047" opacity="0.6" />
  </g>

  <!-- Surrounding Foliage & Lanterns -->
  <g>
    <circle cx="120" cy="400" r="45" fill="#166534" />
    <circle cx="880" cy="400" r="45" fill="#166534" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    النافورة الداخلية وتفاصيل اللاندسكيب
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    عنصر مائي جمالي يضفي لمسة من الأناقة والهدوء على الساحات
  </text>
</svg>
