<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#nightSky)" />

  <!-- Roadway with Night Lighting -->
  <polygon points="500,260 0,650 1000,650" fill="#0B131E" />
  <line x1="500" y1="260" x2="500" y2="650" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="14,14" />

  <!-- Dark Facades with Lit Windows -->
  <polygon points="0,120 400,240 400,550 0,650" fill="#0B121C" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4" />
  <polygon points="1000,120 600,240 600,550 1000,650" fill="#0B121C" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.4" />

  <!-- Warm Windows -->
  <rect x="80" y="220" width="50" height="24" fill="#FDE047" opacity="0.8" rx="2" />
  <rect x="80" y="270" width="60" height="24" fill="#FDE047" opacity="0.65" rx="2" />
  <rect x="870" y="220" width="50" height="24" fill="#FDE047" opacity="0.9" rx="2" />
  <rect x="850" y="310" width="70" height="24" fill="#FDE047" opacity="0.75" rx="2" />

  <!-- Street Lamp Glows -->
  <g transform="translate(340, 390)">
    <circle cx="0" cy="0" r="45" fill="url(#lampGlow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <line x1="0" y1="5" x2="0" y2="90" stroke="#475569" stroke-width="3" />
  </g>
  <g transform="translate(660, 390)">
    <circle cx="0" cy="0" r="45" fill="url(#lampGlow)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <line x1="0" y1="5" x2="0" y2="90" stroke="#475569" stroke-width="3" />
  </g>

  <!-- Label Badge -->
  <rect x="30" y="30" width="370" height="56" rx="6" fill="#0C1420" fill-opacity="0.9" stroke="#D4AF37" stroke-width="1" />
  <text x="45" y="55" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">
    الشارع الداخلي – إضاءة ليلية ساحرة
  </text>
  <text x="45" y="74" font-family="'Cairo', sans-serif" font-size="11" font-weight="500" fill="#D4AF37">
    أجواء مسائية متميزة مع إضاءات فندقية هادئة وأمان كامل
  </text>
</svg>
