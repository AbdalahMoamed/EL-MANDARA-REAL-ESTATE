<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C875" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8F6910" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E7C875" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(30, 20)">
    <!-- Outer Shield / Diamond Frame -->
    <path d="M 50 5 L 95 35 L 95 85 L 50 115 L 5 85 L 5 35 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 50 12 L 88 38 L 88 82 L 50 108 L 12 82 L 12 38 Z" 
          fill="#0C1420" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Stylized Geometric Architectural Crest: Golden 'G' & 'V' -->
    <path d="M 32 36 L 50 24 L 68 36 L 68 76 L 50 88 L 32 76 Z" 
          fill="none" stroke="url(#goldLight)" stroke-width="2" />
    <!-- V Shape -->
    <polyline points="38,48 50,78 62,48" 
              fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Luxury Diamond -->
    <polygon points="50,34 54,40 50,46 46,40" fill="url(#goldLight)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(150, 48)">
    <!-- English Sub-Title -->
    <text x="0" y="0" font-family="'Cairo', 'Cinzel', 'Trajan Pro', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#A4B3C6">
      COMPOUND
    </text>
    
    <!-- Main English Brand Name -->
    <text x="0" y="32" font-family="'Cairo', 'Cinzel', 'Montserrat', sans-serif" font-size="34" font-weight="800" letter-spacing="4" fill="url(#goldLight)" filter="url(#subtleGlow)">
      GOLDEN VIEW
    </text>
    
    <!-- Arabic Slogan / Name -->
    <text x="0" y="58" font-family="'Cairo', 'IBM Plex Sans Arabic', sans-serif" font-size="16" font-weight="600" fill="#E2E8F0">
      حياة متكاملة في قلب السويس
    </text>
  </g>
</svg>
