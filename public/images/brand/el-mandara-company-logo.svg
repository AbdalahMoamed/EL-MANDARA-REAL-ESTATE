<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="100%">
  <defs>
    <linearGradient id="mandaraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#C8B18A" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EEDAA2" />
      <stop offset="50%" stop-color="#C8B18A" />
      <stop offset="100%" stop-color="#8F6910" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="100%" height="100%" rx="12" fill="#0A1322" />

  <!-- Architectural Skyscraper Emblem -->
  <g transform="translate(250, 68)">
    <!-- Base Arcs -->
    <path d="M -70 20 Q 0 -5 70 20" fill="none" stroke="url(#mandaraGold)" stroke-width="3" stroke-linecap="round" />
    <path d="M -55 26 Q 0 6 55 26" fill="none" stroke="url(#mandaraGold)" stroke-width="2" stroke-linecap="round" />

    <!-- Center Highest Tower -->
    <path d="M -16 -48 L 0 -58 L 16 -48 L 16 14 L -16 14 Z" fill="url(#towerGrad)" />
    <!-- Center Tower Facet Lines -->
    <line x1="-6" y1="-44" x2="-6" y2="10" stroke="#0A1322" stroke-width="2" />
    <line x1="6" y1="-44" x2="6" y2="10" stroke="#0A1322" stroke-width="2" />

    <!-- Left Tower 1 -->
    <path d="M -34 -32 L -20 -40 L -20 16 L -34 16 Z" fill="url(#towerGrad)" />
    <line x1="-27" y1="-30" x2="-27" y2="12" stroke="#0A1322" stroke-width="2" />

    <!-- Right Tower 1 -->
    <path d="M 20 -40 L 34 -32 L 34 16 L 20 16 Z" fill="url(#towerGrad)" />
    <line x1="27" y1="-30" x2="27" y2="12" stroke="#0A1322" stroke-width="2" />

    <!-- Left Outer Tower -->
    <path d="M -48 -14 L -38 -20 L -38 18 L -48 18 Z" fill="url(#towerGrad)" />

    <!-- Right Outer Tower -->
    <path d="M 38 -20 L 48 -14 L 48 18 L 38 18 Z" fill="url(#towerGrad)" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Brand Primary Title -->
    <text x="250" y="148" font-family="'Cairo', 'Montserrat', 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#FFFFFF">
      EL MANDARA
    </text>
    
    <!-- Subtitle -->
    <text x="250" y="180" font-family="'Cairo', 'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="10" fill="url(#mandaraGold)" filter="url(#softGlow)">
      REAL ESTATE
    </text>
  </g>
</svg>