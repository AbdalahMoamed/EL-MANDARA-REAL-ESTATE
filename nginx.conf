server {
    listen 80;
    server_name compoundgoldenview.com goldenviewsuez.com www.compoundgoldenview.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name compoundgoldenview.com goldenviewsuez.com www.compoundgoldenview.com;

    # SSL Certificates (e.g. Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/compoundgoldenview.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compoundgoldenview.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/compound-golden-view;
    index index.html;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
